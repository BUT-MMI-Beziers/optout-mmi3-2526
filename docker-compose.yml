services:
  api:
    build: ./api
    image: optout-api:latest
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-float}:${POSTGRES_PASSWORD:-float}@db:5432/${POSTGRES_DB:-float}
    depends_on:
      - db
      - redis
      - mailpit

  worker:
    image: optout-api:latest
    command: npm run worker
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-float}:${POSTGRES_PASSWORD:-float}@db:5432/${POSTGRES_DB:-float}
    depends_on:
      - api
      - db
      - redis
      - mailpit

  scheduler:
    image: optout-api:latest
    command: npm run scheduler
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - api
      - db
      - redis

  front:
    build: ./front
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-float}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-float}
      POSTGRES_DB: ${POSTGRES_DB:-float}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: